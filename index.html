<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Kitchen — Interactive Recipe Cards</title>
    <meta name="description" content="Cook six favorite recipes with ingredient checklists, step-by-step instructions and a countdown timer.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* Base Styles & Typography */
        :root {
            --bg-dark: #1e293b;
            --card-bg: #334155;
            --text-light: #f1f5f9;
            --accent-color: #67e8f9;
            --accent-dark: #06b6d4;
            --success-color: #22c55e;
            --font-main: 'Poppins', sans-serif;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-dark);
            color: var(--text-light);
            margin: 0;
            padding: 0;
        }

        /* Recipe Card Layout */
        .recipe-card {
            background-color: var(--card-bg);
            border-radius: 0;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 100%;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: transform 0.3s ease-in-out;
        }
        
        /* Recipe Image Section */
        .recipe-image {
            width: 100%;
            height: 300px;
            overflow: hidden;
            position: relative;
            background-color: #2c384a;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: bold;
            font-size: 1.2rem;
        }

        .recipe-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            transition: transform 0.5s ease-in-out;
        }
        .recipe-image img:hover {
            transform: scale(1.05);
        }

        /* Main Content and Details */
        .recipe-content {
            padding: 2.5rem;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .recipe-title {
            text-align: center;
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--accent-color);
            margin-top: 0;
            margin-bottom: 0.5rem;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
        }

        .recipe-select-container {
            margin-bottom: 1.5rem;
        }

        .recipe-select-container label {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-light);
            margin-right: 0.5rem;
        }

        .recipe-select-container select {
            background-color: var(--bg-dark);
            color: var(--text-light);
            border: 2px solid var(--accent-color);
            border-radius: 0.5rem;
            padding: 0.5rem;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .recipe-select-container select:hover,
        .recipe-select-container select:focus {
            background-color: #2c384a;
            outline: none;
            box-shadow: 0 0 8px var(--accent-color);
        }

        .details-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
            margin-top: 1.5rem;
        }
        
        .section {
            background-color: var(--bg-dark);
            border-radius: 1.5rem;
            padding: 2rem;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.3);
        }

        .section-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            border-bottom: 2px solid var(--accent-dark);
            padding-bottom: 0.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: color 0.3s ease;
        }
        .section-title:hover {
            color: var(--accent-color);
        }

        .section-content.hidden {
            display: none;
        }
        
        /* Ingredients & Instructions Lists */
        .ingredient-list li, .instruction-list li {
            font-size: 1rem;
            margin-bottom: 0.75rem;
            padding: 0.5rem;
            border-radius: 0.5rem;
            transition: all 0.3s ease;
            cursor: pointer;
            border-left: 4px solid transparent;
        }
        
        .ingredient-list li:hover {
            background-color: rgba(255, 255, 255, 0.05);
            border-left-color: var(--accent-color);
            transform: translateX(5px);
        }

        .instruction-list li:hover {
            background-color: rgba(255, 255, 255, 0.05);
            transform: translateX(5px);
        }
        
        .instruction-list li.active-step {
            background-color: var(--accent-dark);
            border-radius: 0.5rem;
            font-weight: 600;
            box-shadow: 0 0 10px rgba(103, 232, 249, 0.5);
            animation: pulse-border 1.5s infinite ease-in-out;
            transform: scale(1.03);
            border-left-color: var(--success-color);
        }

        /* Preparation Info */
        .prep-info p {
            font-size: 1rem;
            line-height: 1.6;
        }

        .timer-container {
            margin-top: 1.5rem;
            text-align: center;
        }

        .timer {
            font-size: 2rem;
            font-weight: bold;
            color: var(--success-color);
            margin-bottom: 1rem;
        }

        .progress-bar {
            width: 100%;
            height: 10px;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            overflow: hidden;
        }

        .progress {
            height: 100%;
            width: 0;
            background-color: var(--accent-color);
            border-radius: 5px;
            transition: width 0.5s ease-out;
        }

        /* Animation for progress bar */
        @keyframes fill-progress {
            from { width: 0; }
            to { width: 100%; }
        }
        .progress.animated {
            animation: fill-progress 60s linear forwards; /* 60s for 60 min example */
        }
        
        /* Animation for active step */
        @keyframes pulse-border {
            0% { box-shadow: 0 0 10px rgba(103, 232, 249, 0.5); }
            50% { box-shadow: 0 0 20px rgba(103, 232, 249, 0.8); }
            100% { box-shadow: 0 0 10px rgba(103, 232, 249, 0.5); }
        }

        /* Control Buttons */
        .control-buttons {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-top: 2rem;
        }

        .btn {
            padding: 1rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 1rem;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-start {
            background-color: var(--accent-color);
            color: var(--bg-dark);
        }
        .btn-start:hover {
            background-color: var(--accent-dark);
            color: var(--text-light);
            transform: translateY(-3px);
            box-shadow: 0 5px 10px rgba(103, 232, 249, 0.3);
        }

        .btn-next {
            background-color: var(--success-color);
            color: var(--bg-dark);
            display: none;
        }
        .btn-next:hover {
            background-color: #15803d;
            color: var(--text-light);
            transform: translateY(-3px);
            box-shadow: 0 5px 10px rgba(34, 197, 94, 0.3);
        }

        /* New button for Gemini API feature */
        .btn-gemini-mod {
            background-color: #9333ea; /* A vibrant purple */
            color: var(--text-light);
        }
        .btn-gemini-mod:hover {
            background-color: #7e22ce;
            color: var(--text-light);
            transform: translateY(-3px);
            box-shadow: 0 5px 10px rgba(147, 51, 234, 0.3);
        }
        
        .btn-tts {
            background-color: #4f46e5; /* Indigo */
            color: var(--text-light);
        }
        .btn-tts:hover {
            background-color: #4338ca;
            color: var(--text-light);
            transform: translateY(-3px);
            box-shadow: 0 5px 10px rgba(79, 70, 229, 0.3);
        }
        
        /* Gemini API Sections */
        .gemini-section {
            background-color: #2c384a;
            border-radius: 1.5rem;
            padding: 2rem;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.3);
            margin-top: 2rem;
        }
        .gemini-section h2 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 0.5rem;
        }
        .gemini-input-container {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
        }
        .gemini-input-container input {
            flex-grow: 1;
            padding: 0.75rem;
            border-radius: 0.5rem;
            border: 2px solid #556070;
            background-color: #1a232f;
            color: var(--text-light);
            font-size: 1rem;
        }
        .gemini-input-container button {
            background-color: var(--accent-color);
            color: var(--bg-dark);
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            border: none;
            cursor: pointer;
            transition: background-color 0.3s ease;
            font-weight: 600;
        }
        .gemini-input-container button:hover {
            background-color: var(--accent-dark);
        }
        .gemini-input-container button:disabled {
            background-color: #788a9c;
            cursor: not-allowed;
        }
        .gemini-response {
            background-color: #1a232f;
            padding: 1rem;
            border-radius: 0.5rem;
            min-height: 50px;
            white-space: pre-wrap;
            line-height: 1.6;
            animation: fadeIn 0.5s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        .modified-recipe-section {
            margin-top: 2rem;
        }
        .modified-recipe-title {
            text-align: center;
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-light);
            margin-bottom: 1rem;
        }
        .modified-recipe-list {
            list-style: none;
            padding: 0;
        }
        .modified-recipe-list li {
            padding: 0.75rem 1rem;
            background-color: var(--bg-dark);
            border-radius: 0.5rem;
            margin-bottom: 0.5rem;
        }
        .modified-recipe-loader {
            text-align: center;
            padding: 1rem;
        }

        /* Responsive Design */
        @media (min-width: 768px) {
            .recipe-card {
                flex-direction: row;
            }

            .recipe-image {
                flex: 1;
                height: auto;
            }

            .recipe-content {
                flex: 1;
            }

            .details-grid {
                grid-template-columns: 1fr 1fr;
            }
        }
        
        /* New styling for the small image next to the title */
        .recipe-title-container-inner {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .recipe-title-image {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
        
        .loader {
          border: 4px solid var(--accent-color);
          border-top: 4px solid var(--accent-dark);
          border-radius: 50%;
          width: 30px;
          height: 30px;
          animation: spin 1s linear infinite;
        }
        @keyframes spin {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
        }

        /* Print-friendly Styles (Bonus) */
        @media print {
            body {
                background-color: white;
                color: black;
            }
            .recipe-card {
                box-shadow: none;
                border: 1px solid #ccc;
            }
            .section, .btn {
                background-color: transparent;
                box-shadow: none;
                border: none;
                color: black;
            }
            .section-title {
                border-bottom: 2px solid #ccc;
            }
            .instruction-list li.active-step {
                background-color: transparent;
                color: black;
                box-shadow: none;
                animation: none;
                border-left-color: #000;
            }
            .control-buttons, .timer-container, .gemini-section, .recipe-select-container, .modified-recipe-section {
                display: none;
            }
            .recipe-image img {
                width: 50%;
                height: auto;
                float: left;
                margin-right: 20px;
            }
            h1, h2 {
                color: black !important;
                text-shadow: none;
            }
        }

        .recipe-card { flex-direction: column; }
        .recipe-image { flex: none; height: 260px; }
        .recipe-image img { object-fit: contain; }
        .recipe-content { flex: none; }
        .hidden { display: none; }
        * { box-sizing: border-box; }
        body { padding: 24px; }
        .recipe-card { max-width: 1400px; margin: auto; border-radius: 24px; }
        .recipe-image { min-width: 0; }
        .recipe-content { min-width: 0; }
        .recipe-select-container select { max-width: 100%; }
        .recipe-title { font-size: clamp(1.65rem, 3vw, 2.5rem); }
        .recipe-title-container-inner { flex-wrap: wrap; }
        .section { padding: 1.25rem; min-width: 0; }
        .section-title { margin-top: 0; }
        .section-toggle { font: inherit; color: inherit; width: 100%; background: none; border: 0; text-align: left; padding: 0; cursor: pointer; }
        .section-toggle::after { content: ' −'; float: right; }
        .section-toggle[aria-expanded="false"]::after { content: ' +'; }
        .ingredient-list { list-style: none; padding: 0; }
        .ingredient-list label { display: flex; align-items: baseline; gap: 10px; cursor: pointer; }
        .ingredient-list input { accent-color: var(--accent-dark); }
        .ingredient-list label:has(input:checked) span { text-decoration: line-through; opacity: .6; }
        .instruction-list { padding-left: 1.4rem; }
        button:focus-visible, input:focus-visible, a:focus-visible { outline: 3px solid var(--accent-color); outline-offset: 4px; }
        .recipe-image img { min-height: 0; }
        .cooking-status { min-height: 1.5em; font-size: .9rem; }
        .site-footer { max-width: 1400px; margin: 20px auto; text-align: center; font-size: .8rem; }
        .site-footer a { color: var(--accent-color); }
        @media (min-width: 768px) and (max-width: 1150px) { .details-grid { grid-template-columns: 1fr; } .recipe-content { flex: 1.5; } }
        @media (max-width: 767px) { body { padding: 12px; } .recipe-content { padding: 1.25rem; gap: 1rem; } .recipe-image { height: 220px; } .recipe-image img { min-height: 220px; } .recipe-select-container label { display: block; margin-bottom: 10px; } .recipe-select-container select { width: 100%; } }
        @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
        @media print { body { padding: 0; } .recipe-card { display: block; } .recipe-image, .recipe-title-image, .site-footer, .section-toggle::after { display: none; } .recipe-content { padding: 0; } .section-content.hidden, .ingredient-list.hidden, .instruction-list.hidden { display: block; } .section-title { cursor: default; } }
    </style>
</head>
<body>
    <main class="recipe-card">
        <!-- Recipe Image Section (main image) -->
        <div class="recipe-image" id="recipe-image-container">
            <img src="" alt="" id="recipe-image">
        </div>

        <!-- Main Recipe Content -->
        <div class="recipe-content">
            
            <div class="recipe-select-container">
                <label for="recipe-select">Select a Recipe:</label>
                <select id="recipe-select"></select>
            </div>
            
            <!-- New container for the title and its image -->
            <div class="recipe-title-container-inner">
                <img id="recipe-title-image" class="recipe-title-image" src="" alt="">
                <h1 class="recipe-title" id="recipe-title"></h1>
            </div>

            <div class="details-grid">
                <!-- Ingredients Section -->
                <div class="section" id="ingredients-section">
                    <h2 class="section-title"><button class="section-toggle" aria-expanded="true" aria-controls="ingredient-list">Ingredients</button></h2>
                    <ul class="ingredient-list" id="ingredient-list"></ul>
                </div>
                
                <!-- Instructions and Timer -->
                <div class="section" id="instructions-section">
                    <h2 class="section-title"><button class="section-toggle" aria-expanded="true" aria-controls="instruction-list">Instructions</button></h2>
                    <ol class="instruction-list" id="instruction-list"></ol>
                    
                    <div class="control-buttons">
                        <button class="btn btn-start" id="start-btn">Start Cooking</button>
                        <button class="btn btn-next" id="next-btn">Next Step</button>
                    </div>

                    <!-- Preparation Info and Progress Bar (Optional) -->
                    <div class="timer-container">
                        <p class="timer" id="timer" role="timer" aria-label="Cooking countdown"></p><p class="cooking-status" id="cooking-status" role="status"></p>
                        <div class="progress-bar" role="progressbar" aria-label="Elapsed cooking time" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                            <div class="progress" id="progress-bar-el"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <footer class="site-footer">Recipe Kitchen · <a href="https://github.com/abhishekgb1/Interactive-Recipe-Card-with-Animations" target="_blank" rel="noopener noreferrer">View source on GitHub</a></footer>
    <script>
        // Recipe data stored in a JSON object
        const recipes = {
            "Chocolate Fudge Cake": {
                image: "https://placehold.co/800x600/334155/f1f5f9?text=Chocolate+Fudge+Cake",
                ingredients: [
                    "1 3/4 cups all-purpose flour",
                    "1 3/4 cups granulated sugar",
                    "3/4 cup unsweetened cocoa powder",
                    "1 1/2 teaspoons baking soda",
                    "1 1/2 teaspoons baking powder",
                    "1 teaspoon salt",
                    "2 large eggs",
                    "1 cup milk",
                    "1/2 cup vegetable oil",
                    "2 teaspoons vanilla extract",
                    "1 cup boiling water"
                ],
                instructions: [
                    "Preheat oven to 350°F (175°C). Grease and flour two 9-inch round cake pans.",
                    "In a large bowl, sift together flour, sugar, cocoa, baking soda, baking powder, and salt.",
                    "In a separate bowl, mix together eggs, milk, oil, and vanilla. Add to the dry ingredients and beat with a mixer.",
                    "Carefully stir in the boiling water. The batter will be thin.",
                    "Pour evenly into the prepared pans and bake for 30 to 35 minutes, or until a toothpick inserted into the center comes out clean.",
                    "Let cool in the pans for 10 minutes before turning out onto a wire rack to cool completely."
                ],
                prepTime: 45 // in minutes
            },
            "Classic Pancakes": {
                image: "https://placehold.co/800x600/fecaca/fff?text=Classic+Pancakes",
                ingredients: [
                    "1 1/2 cups all-purpose flour",
                    "3 1/2 teaspoons baking powder",
                    "1 teaspoon salt",
                    "1 tablespoon white sugar",
                    "1 1/4 cups milk",
                    "1 egg",
                    "3 tablespoons butter, melted"
                ],
                instructions: [
                    "In a large bowl, sift together flour, baking powder, salt and sugar.",
                    "Make a well in the center and pour in the milk, egg and melted butter; mix until smooth.",
                    "Heat a lightly oiled griddle or frying pan over medium-high heat. Pour or scoop the batter onto the griddle.",
                    "Cook until pancakes are golden brown on both sides; flip once."
                ],
                prepTime: 20
            },
            "Roasted Chicken": {
                image: "https://placehold.co/800x600/fcd34d/292524?text=Roasted+Chicken",
                ingredients: [
                    "1 (5 pound) whole chicken",
                    "2 tablespoons olive oil",
                    "1 tablespoon dried thyme",
                    "1 tablespoon dried rosemary",
                    "1 teaspoon paprika",
                    "Salt and pepper to taste"
                ],
                instructions: [
                    "Preheat oven to 425°F (220°C).",
                    "Remove chicken from refrigerator and pat dry with paper towels.",
                    "Rub chicken with olive oil and then with thyme, rosemary, paprika, salt and pepper.",
                    "Roast for 1 hour and 20 minutes, or until the juices run clear when pierced with a fork."
                ],
                prepTime: 80
            },
            "Spaghetti Bolognese": {
                image: "https://placehold.co/800x600/f2f2f2/333?text=Spaghetti+Bolognese",
                ingredients: [
                    "1 pound ground beef",
                    "1 medium onion, chopped",
                    "2 cloves garlic, minced",
                    "1 (28 ounce) can crushed tomatoes",
                    "1 cup beef broth",
                    "1/2 teaspoon dried oregano",
                    "1/2 teaspoon dried basil",
                    "1 pound spaghetti",
                    "Salt and pepper to taste"
                ],
                instructions: [
                    "In a large pot, cook ground beef, onion, and garlic over medium-high heat until meat is browned.",
                    "Drain fat. Stir in crushed tomatoes, beef broth, oregano, basil, salt, and pepper.",
                    "Reduce heat and simmer for at least 30 minutes, stirring occasionally.",
                    "Meanwhile, cook spaghetti according to package directions. Drain well.",
                    "Serve the sauce over the cooked spaghetti."
                ],
                prepTime: 50
            },
            "Classic Guacamole": {
                image: "https://placehold.co/800x600/b1d471/000?text=Classic+Guacamole",
                ingredients: [
                    "3 ripe avocados",
                    "1 small onion, finely chopped",
                    "2 cloves garlic, minced",
                    "1 jalapeno, minced (optional)",
                    "1 ripe tomato, chopped",
                    "1 tablespoon fresh lime juice",
                    "1/4 cup chopped fresh cilantro",
                    "Salt and pepper to taste"
                ],
                instructions: [
                    "Halve the avocados and remove the pits. Scoop the flesh into a medium bowl.",
                    "Mash the avocado with a fork to your desired consistency.",
                    "Stir in the onion, garlic, jalapeno (if using), tomato, lime juice, cilantro, salt, and pepper.",
                    "Mix well and serve immediately with tortilla chips."
                ],
                prepTime: 15
            },
            "Mashed Potatoes": {
                image: "https://placehold.co/800x600/d4a373/000?text=Mashed+Potatoes",
                ingredients: [
                    "2 pounds russet potatoes, peeled and cubed",
                    "1/2 cup heavy cream",
                    "4 tablespoons unsalted butter",
                    "Salt and white pepper to taste"
                ],
                instructions: [
                    "Place potatoes in a large pot and cover with cold, salted water. Bring to a boil and cook until tender, about 15-20 minutes.",
                    "Drain potatoes and return to the hot pot to dry out for a minute.",
                    "Add heavy cream and butter to the potatoes. Mash until smooth and creamy.",
                    "Season with salt and white pepper. Serve hot."
                ],
                prepTime: 30
            }
        };

        const recipeSelect = document.getElementById('recipe-select');
        const recipeTitleEl = document.getElementById('recipe-title');
        const recipeImageEl = document.getElementById('recipe-image');
        const recipeTitleImageEl = document.getElementById('recipe-title-image');
        const ingredientListEl = document.getElementById('ingredient-list');
        const instructionListEl = document.getElementById('instruction-list');
        const startBtn = document.getElementById('start-btn');
        const nextBtn = document.getElementById('next-btn');
        const progressBar = document.getElementById('progress-bar-el');
        const progress = document.querySelector('[role="progressbar"]');
        const timerDisplay = document.getElementById('timer');
        const status = document.getElementById('cooking-status');
        let currentStepIndex = -1;
        let timerInterval;
        let deadline;
        function resetRecipeState() {
            clearInterval(timerInterval);
            currentStepIndex = -1;
            instructionListEl.querySelectorAll('li').forEach(item => { item.classList.remove('active-step'); item.removeAttribute('aria-current'); });
            startBtn.textContent = 'Start Cooking';
            nextBtn.textContent = 'Next Step';
            nextBtn.style.display = 'none';
            nextBtn.disabled = false;
            progressBar.style.width = '0%';
            progress.setAttribute('aria-valuenow', '0');
            timerDisplay.textContent = `${recipes[recipeSelect.value].prepTime}:00`;
            status.textContent = '';
        }
        function loadRecipe(name) {
            const recipe = recipes[name];
            recipeTitleEl.textContent = name;
            recipeImageEl.src = recipe.image;
            document.getElementById("recipe-image-container").style.backgroundColor = "#" + recipe.image.split("/")[4];
            recipeImageEl.alt = name;
            recipeTitleImageEl.src = recipe.image;
            recipeTitleImageEl.alt = '';
            ingredientListEl.replaceChildren(...recipe.ingredients.map(ingredient => {
                const li = document.createElement('li');
                const label = document.createElement('label');
                const checkbox = document.createElement('input'); checkbox.type = 'checkbox';
                const text = document.createElement('span'); text.textContent = ingredient;
                label.append(checkbox, text); li.append(label); return li;
            }));
            instructionListEl.replaceChildren(...recipe.instructions.map(instruction => { const li = document.createElement('li'); li.textContent = instruction; return li; }));
            document.querySelectorAll('.section-toggle').forEach(button => { button.setAttribute('aria-expanded','true'); document.getElementById(button.getAttribute('aria-controls')).classList.remove('hidden'); });
            resetRecipeState();
        }
        function showStep() {
            const items = instructionListEl.querySelectorAll('li');
            items.forEach((item,index) => { item.classList.toggle('active-step',index === currentStepIndex); if(index === currentStepIndex) item.setAttribute('aria-current','step'); else item.removeAttribute('aria-current'); });
            status.textContent = `Step ${currentStepIndex + 1} of ${items.length}`;
            nextBtn.textContent = currentStepIndex === items.length - 1 ? 'Finish Cooking' : 'Next Step';
        }
        function tick() {
            const total = recipes[recipeSelect.value].prepTime * 60;
            const remaining = Math.max(0, Math.ceil((deadline - Date.now()) / 1000));
            timerDisplay.textContent = `${Math.floor(remaining / 60)}:${String(remaining % 60).padStart(2,'0')}`;
            const percent = Math.min(100, (total - remaining) / total * 100);
            progressBar.style.width = `${percent}%`;
            progress.setAttribute('aria-valuenow',String(Math.round(percent)));
            if (remaining === 0) { clearInterval(timerInterval); status.textContent = 'Timer finished. Check your food before continuing.'; }
        }
        startBtn.addEventListener('click', () => {
            if (currentStepIndex !== -1) { resetRecipeState(); return; }
            currentStepIndex = 0;
            startBtn.textContent = 'Reset';
            nextBtn.style.display = 'block';
            instructionListEl.classList.remove('hidden');
            document.querySelector('[aria-controls="instruction-list"]').setAttribute('aria-expanded','true');
            deadline = Date.now() + recipes[recipeSelect.value].prepTime * 60000;
            clearInterval(timerInterval); tick(); timerInterval = setInterval(tick,250);
            showStep();
        });
        nextBtn.addEventListener('click', () => {
            if (nextBtn.disabled || currentStepIndex < 0) return;
            currentStepIndex++;
            if (currentStepIndex < recipes[recipeSelect.value].instructions.length) showStep();
            else {
                clearInterval(timerInterval);
                instructionListEl.querySelectorAll('li').forEach(item => { item.classList.remove('active-step'); item.removeAttribute('aria-current'); });
                nextBtn.textContent = 'Finished!'; nextBtn.disabled = true;
                status.textContent = 'You finished the recipe. Enjoy!';
            }
        });
        document.querySelectorAll('.section-toggle').forEach(button => button.addEventListener('click', () => {
            const expanded = button.getAttribute('aria-expanded') === 'true';
            button.setAttribute('aria-expanded',String(!expanded));
            document.getElementById(button.getAttribute('aria-controls')).classList.toggle('hidden',expanded);
        }));
        for(const name of Object.keys(recipes)) { const option = document.createElement('option'); option.value = name; option.textContent = name; recipeSelect.append(option); }
        recipeSelect.addEventListener('change', () => loadRecipe(recipeSelect.value));
        loadRecipe(recipeSelect.value);

    </script>
</body>
</html>
