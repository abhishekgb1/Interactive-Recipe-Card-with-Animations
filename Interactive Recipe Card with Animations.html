<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Recipe Card</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* Base Styles & Typography */
        :root {
            --bg-dark: #1e293b;
            --card-bg: #334155;
            --text-light: #f1f5f9;
            --accent-color: #67e8f9;
            --accent-dark: #06b6d4;
            --success-color: #22c55e;
            --font-main: 'Poppins', sans-serif;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-dark);
            color: var(--text-light);
            margin: 0;
            padding: 0;
        }

        /* Recipe Card Layout */
        .recipe-card {
            background-color: var(--card-bg);
            border-radius: 0;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 100%;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: transform 0.3s ease-in-out;
        }
        
        /* Recipe Image Section */
        .recipe-image {
            width: 100%;
            height: 300px;
            overflow: hidden;
            position: relative;
            background-color: #2c384a;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: bold;
            font-size: 1.2rem;
        }

        .recipe-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            transition: transform 0.5s ease-in-out;
        }
        .recipe-image img:hover {
            transform: scale(1.05);
        }

        /* Main Content and Details */
        .recipe-content {
            padding: 2.5rem;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .recipe-title {
            text-align: center;
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--accent-color);
            margin-top: 0;
            margin-bottom: 0.5rem;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
        }

        .recipe-select-container {
            margin-bottom: 1.5rem;
        }

        .recipe-select-container label {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-light);
            margin-right: 0.5rem;
        }

        .recipe-select-container select {
            background-color: var(--bg-dark);
            color: var(--text-light);
            border: 2px solid var(--accent-color);
            border-radius: 0.5rem;
            padding: 0.5rem;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .recipe-select-container select:hover,
        .recipe-select-container select:focus {
            background-color: #2c384a;
            outline: none;
            box-shadow: 0 0 8px var(--accent-color);
        }

        .details-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
            margin-top: 1.5rem;
        }
        
        .section {
            background-color: var(--bg-dark);
            border-radius: 1.5rem;
            padding: 2rem;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.3);
        }

        .section-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            border-bottom: 2px solid var(--accent-dark);
            padding-bottom: 0.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: color 0.3s ease;
        }
        .section-title:hover {
            color: var(--accent-color);
        }

        .section-content.hidden {
            display: none;
        }
        
        /* Ingredients & Instructions Lists */
        .ingredient-list li, .instruction-list li {
            font-size: 1rem;
            margin-bottom: 0.75rem;
            padding: 0.5rem;
            border-radius: 0.5rem;
            transition: all 0.3s ease;
            cursor: pointer;
            border-left: 4px solid transparent;
        }
        
        .ingredient-list li:hover {
            background-color: rgba(255, 255, 255, 0.05);
            border-left-color: var(--accent-color);
            transform: translateX(5px);
        }

        .instruction-list li:hover {
            background-color: rgba(255, 255, 255, 0.05);
            transform: translateX(5px);
        }
        
        .instruction-list li.active-step {
            background-color: var(--accent-dark);
            border-radius: 0.5rem;
            font-weight: 600;
            box-shadow: 0 0 10px rgba(103, 232, 249, 0.5);
            animation: pulse-border 1.5s infinite ease-in-out;
            transform: scale(1.03);
            border-left-color: var(--success-color);
        }

        /* Preparation Info */
        .prep-info p {
            font-size: 1rem;
            line-height: 1.6;
        }

        .timer-container {
            margin-top: 1.5rem;
            text-align: center;
        }

        .timer {
            font-size: 2rem;
            font-weight: bold;
            color: var(--success-color);
            margin-bottom: 1rem;
        }

        .progress-bar {
            width: 100%;
            height: 10px;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            overflow: hidden;
        }

        .progress {
            height: 100%;
            width: 0;
            background-color: var(--accent-color);
            border-radius: 5px;
            transition: width 0.5s ease-out;
        }

        /* Animation for progress bar */
        @keyframes fill-progress {
            from { width: 0; }
            to { width: 100%; }
        }
        .progress.animated {
            animation: fill-progress 60s linear forwards; /* 60s for 60 min example */
        }
        
        /* Animation for active step */
        @keyframes pulse-border {
            0% { box-shadow: 0 0 10px rgba(103, 232, 249, 0.5); }
            50% { box-shadow: 0 0 20px rgba(103, 232, 249, 0.8); }
            100% { box-shadow: 0 0 10px rgba(103, 232, 249, 0.5); }
        }

        /* Control Buttons */
        .control-buttons {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-top: 2rem;
        }

        .btn {
            padding: 1rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 1rem;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-start {
            background-color: var(--accent-color);
            color: var(--bg-dark);
        }
        .btn-start:hover {
            background-color: var(--accent-dark);
            color: var(--text-light);
            transform: translateY(-3px);
            box-shadow: 0 5px 10px rgba(103, 232, 249, 0.3);
        }

        .btn-next {
            background-color: var(--success-color);
            color: var(--bg-dark);
            display: none;
        }
        .btn-next:hover {
            background-color: #15803d;
            color: var(--text-light);
            transform: translateY(-3px);
            box-shadow: 0 5px 10px rgba(34, 197, 94, 0.3);
        }

        /* New button for Gemini API feature */
        .btn-gemini-mod {
            background-color: #9333ea; /* A vibrant purple */
            color: var(--text-light);
        }
        .btn-gemini-mod:hover {
            background-color: #7e22ce;
            color: var(--text-light);
            transform: translateY(-3px);
            box-shadow: 0 5px 10px rgba(147, 51, 234, 0.3);
        }
        
        .btn-tts {
            background-color: #4f46e5; /* Indigo */
            color: var(--text-light);
        }
        .btn-tts:hover {
            background-color: #4338ca;
            color: var(--text-light);
            transform: translateY(-3px);
            box-shadow: 0 5px 10px rgba(79, 70, 229, 0.3);
        }
        
        /* Gemini API Sections */
        .gemini-section {
            background-color: #2c384a;
            border-radius: 1.5rem;
            padding: 2rem;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.3);
            margin-top: 2rem;
        }
        .gemini-section h2 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 0.5rem;
        }
        .gemini-input-container {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
        }
        .gemini-input-container input {
            flex-grow: 1;
            padding: 0.75rem;
            border-radius: 0.5rem;
            border: 2px solid #556070;
            background-color: #1a232f;
            color: var(--text-light);
            font-size: 1rem;
        }
        .gemini-input-container button {
            background-color: var(--accent-color);
            color: var(--bg-dark);
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            border: none;
            cursor: pointer;
            transition: background-color 0.3s ease;
            font-weight: 600;
        }
        .gemini-input-container button:hover {
            background-color: var(--accent-dark);
        }
        .gemini-input-container button:disabled {
            background-color: #788a9c;
            cursor: not-allowed;
        }
        .gemini-response {
            background-color: #1a232f;
            padding: 1rem;
            border-radius: 0.5rem;
            min-height: 50px;
            white-space: pre-wrap;
            line-height: 1.6;
            animation: fadeIn 0.5s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        .modified-recipe-section {
            margin-top: 2rem;
        }
        .modified-recipe-title {
            text-align: center;
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-light);
            margin-bottom: 1rem;
        }
        .modified-recipe-list {
            list-style: none;
            padding: 0;
        }
        .modified-recipe-list li {
            padding: 0.75rem 1rem;
            background-color: var(--bg-dark);
            border-radius: 0.5rem;
            margin-bottom: 0.5rem;
        }
        .modified-recipe-loader {
            text-align: center;
            padding: 1rem;
        }

        /* Responsive Design */
        @media (min-width: 768px) {
            .recipe-card {
                flex-direction: row;
            }

            .recipe-image {
                flex: 1;
                height: auto;
            }

            .recipe-content {
                flex: 1;
            }

            .details-grid {
                grid-template-columns: 1fr 1fr;
            }
        }
        
        /* New styling for the small image next to the title */
        .recipe-title-container-inner {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .recipe-title-image {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
        
        .loader {
          border: 4px solid var(--accent-color);
          border-top: 4px solid var(--accent-dark);
          border-radius: 50%;
          width: 30px;
          height: 30px;
          animation: spin 1s linear infinite;
        }
        @keyframes spin {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
        }

        /* Print-friendly Styles (Bonus) */
        @media print {
            body {
                background-color: white;
                color: black;
            }
            .recipe-card {
                box-shadow: none;
                border: 1px solid #ccc;
            }
            .section, .btn {
                background-color: transparent;
                box-shadow: none;
                border: none;
                color: black;
            }
            .section-title {
                border-bottom: 2px solid #ccc;
            }
            .instruction-list li.active-step {
                background-color: transparent;
                color: black;
                box-shadow: none;
                animation: none;
                border-left-color: #000;
            }
            .control-buttons, .timer-container, .gemini-section, .recipe-select-container, .modified-recipe-section {
                display: none;
            }
            .recipe-image img {
                width: 50%;
                height: auto;
                float: left;
                margin-right: 20px;
            }
            h1, h2 {
                color: black !important;
                text-shadow: none;
            }
        }
    </style>
</head>
<body>
    <div class="recipe-card">
        <!-- Recipe Image Section (main image) -->
        <div class="recipe-image" id="recipe-image-container">
            <img src="" alt="" id="recipe-image">
        </div>

        <!-- Main Recipe Content -->
        <div class="recipe-content">
            
            <div class="recipe-select-container">
                <label for="recipe-select">Select a Recipe:</label>
                <select id="recipe-select"></select>
            </div>
            
            <!-- New container for the title and its image -->
            <div class="recipe-title-container-inner">
                <img id="recipe-title-image" class="recipe-title-image" src="" alt="">
                <h1 class="recipe-title" id="recipe-title"></h1>
            </div>

            <div class="details-grid">
                <!-- Ingredients Section -->
                <div class="section" id="ingredients-section">
                    <h2 class="section-title">Ingredients</h2>
                    <ul class="ingredient-list" id="ingredient-list"></ul>
                </div>
                
                <!-- Instructions and Timer -->
                <div class="section" id="instructions-section">
                    <h2 class="section-title">Instructions</h2>
                    <ol class="instruction-list" id="instruction-list"></ol>
                    
                    <div class="control-buttons">
                        <button class="btn btn-start" id="start-btn">Start Cooking</button>
                        <button class="btn btn-next" id="next-btn">Next Step</button>
                    </div>

                    <!-- Preparation Info and Progress Bar (Optional) -->
                    <div class="timer-container">
                        <p class="timer" id="timer"></p>
                        <div class="progress-bar">
                            <div class="progress" id="progress-bar-el"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // Recipe data stored in a JSON object
        const recipes = {
            "Chocolate Fudge Cake": {
                image: "https://placehold.co/800x600/334155/f1f5f9?text=Chocolate+Fudge+Cake",
                ingredients: [
                    "1 3/4 cups all-purpose flour",
                    "1 3/4 cups granulated sugar",
                    "3/4 cup unsweetened cocoa powder",
                    "1 1/2 teaspoons baking soda",
                    "1 1/2 teaspoons baking powder",
                    "1 teaspoon salt",
                    "2 large eggs",
                    "1 cup milk",
                    "1/2 cup vegetable oil",
                    "2 teaspoons vanilla extract",
                    "1 cup boiling water"
                ],
                instructions: [
                    "Preheat oven to 350°F (175°C). Grease and flour two 9-inch round cake pans.",
                    "In a large bowl, sift together flour, sugar, cocoa, baking soda, baking powder, and salt.",
                    "In a separate bowl, mix together eggs, milk, oil, and vanilla. Add to the dry ingredients and beat with a mixer.",
                    "Carefully stir in the boiling water. The batter will be thin.",
                    "Pour evenly into the prepared pans and bake for 30 to 35 minutes, or until a toothpick inserted into the center comes out clean.",
                    "Let cool in the pans for 10 minutes before turning out onto a wire rack to cool completely."
                ],
                prepTime: 45 // in minutes
            },
            "Classic Pancakes": {
                image: "https://placehold.co/800x600/fecaca/fff?text=Classic+Pancakes",
                ingredients: [
                    "1 1/2 cups all-purpose flour",
                    "3 1/2 teaspoons baking powder",
                    "1 teaspoon salt",
                    "1 tablespoon white sugar",
                    "1 1/4 cups milk",
                    "1 egg",
                    "3 tablespoons butter, melted"
                ],
                instructions: [
                    "In a large bowl, sift together flour, baking powder, salt and sugar.",
                    "Make a well in the center and pour in the milk, egg and melted butter; mix until smooth.",
                    "Heat a lightly oiled griddle or frying pan over medium-high heat. Pour or scoop the batter onto the griddle.",
                    "Cook until pancakes are golden brown on both sides; flip once."
                ],
                prepTime: 20
            },
            "Roasted Chicken": {
                image: "https://placehold.co/800x600/fcd34d/292524?text=Roasted+Chicken",
                ingredients: [
                    "1 (5 pound) whole chicken",
                    "2 tablespoons olive oil",
                    "1 tablespoon dried thyme",
                    "1 tablespoon dried rosemary",
                    "1 teaspoon paprika",
                    "Salt and pepper to taste"
                ],
                instructions: [
                    "Preheat oven to 425°F (220°C).",
                    "Remove chicken from refrigerator and pat dry with paper towels.",
                    "Rub chicken with olive oil and then with thyme, rosemary, paprika, salt and pepper.",
                    "Roast for 1 hour and 20 minutes, or until the juices run clear when pierced with a fork."
                ],
                prepTime: 80
            },
            "Spaghetti Bolognese": {
                image: "https://placehold.co/800x600/f2f2f2/333?text=Spaghetti+Bolognese",
                ingredients: [
                    "1 pound ground beef",
                    "1 medium onion, chopped",
                    "2 cloves garlic, minced",
                    "1 (28 ounce) can crushed tomatoes",
                    "1 cup beef broth",
                    "1/2 teaspoon dried oregano",
                    "1/2 teaspoon dried basil",
                    "1 pound spaghetti",
                    "Salt and pepper to taste"
                ],
                instructions: [
                    "In a large pot, cook ground beef, onion, and garlic over medium-high heat until meat is browned.",
                    "Drain fat. Stir in crushed tomatoes, beef broth, oregano, basil, salt, and pepper.",
                    "Reduce heat and simmer for at least 30 minutes, stirring occasionally.",
                    "Meanwhile, cook spaghetti according to package directions. Drain well.",
                    "Serve the sauce over the cooked spaghetti."
                ],
                prepTime: 50
            },
            "Classic Guacamole": {
                image: "https://placehold.co/800x600/b1d471/000?text=Classic+Guacamole",
                ingredients: [
                    "3 ripe avocados",
                    "1 small onion, finely chopped",
                    "2 cloves garlic, minced",
                    "1 jalapeno, minced (optional)",
                    "1 ripe tomato, chopped",
                    "1 tablespoon fresh lime juice",
                    "1/4 cup chopped fresh cilantro",
                    "Salt and pepper to taste"
                ],
                instructions: [
                    "Halve the avocados and remove the pits. Scoop the flesh into a medium bowl.",
                    "Mash the avocado with a fork to your desired consistency.",
                    "Stir in the onion, garlic, jalapeno (if using), tomato, lime juice, cilantro, salt, and pepper.",
                    "Mix well and serve immediately with tortilla chips."
                ],
                prepTime: 15
            },
            "Mashed Potatoes": {
                image: "https://placehold.co/800x600/d4a373/000?text=Mashed+Potatoes",
                ingredients: [
                    "2 pounds russet potatoes, peeled and cubed",
                    "1/2 cup heavy cream",
                    "4 tablespoons unsalted butter",
                    "Salt and white pepper to taste"
                ],
                instructions: [
                    "Place potatoes in a large pot and cover with cold, salted water. Bring to a boil and cook until tender, about 15-20 minutes.",
                    "Drain potatoes and return to the hot pot to dry out for a minute.",
                    "Add heavy cream and butter to the potatoes. Mash until smooth and creamy.",
                    "Season with salt and white pepper. Serve hot."
                ],
                prepTime: 30
            }
        };

        // DOM Element References
        const recipeSelect = document.getElementById('recipe-select');
        const recipeTitleEl = document.getElementById('recipe-title');
        const recipeTitleImageEl = document.getElementById('recipe-title-image');
        const recipeImageEl = document.getElementById('recipe-image');
        const ingredientListEl = document.getElementById('ingredient-list');
        const instructionListEl = document.getElementById('instruction-list');
        const startBtn = document.getElementById('start-btn');
        const nextBtn = document.getElementById('next-btn');
        const progressBar = document.getElementById('progress-bar-el');
        const timerDisplay = document.getElementById('timer');

        let currentStepIndex = 0;
        let timerInterval;

        // Function to load a recipe from the `recipes` object
        function loadRecipe(recipeName) {
            const recipe = recipes[recipeName];
            if (!recipe) return;

            // Update recipe details
            recipeTitleEl.textContent = recipeName;
            timerDisplay.textContent = `${recipe.prepTime}:00`;
            
            // Set the images directly from the recipe object
            recipeImageEl.src = recipe.image;
            recipeTitleImageEl.src = recipe.image;
            recipeImageEl.alt = recipeName;
            recipeTitleImageEl.alt = `${recipeName} image`;
            
            // Populate ingredients list
            ingredientListEl.innerHTML = '';
            recipe.ingredients.forEach(ingredient => {
                const li = document.createElement('li');
                li.textContent = ingredient;
                ingredientListEl.appendChild(li);
            });

            // Populate instructions list
            instructionListEl.innerHTML = '';
            recipe.instructions.forEach(instruction => {
                const li = document.createElement('li');
                li.textContent = instruction;
                instructionListEl.appendChild(li);
            });

            // Reset cooking state
            resetRecipeState();
        }

        // Function to reset the recipe state
        const resetRecipeState = () => {
            const instructionItems = document.querySelectorAll('#instruction-list li');
            instructionItems.forEach(item => item.classList.remove('active-step'));
            currentStepIndex = 0;
            startBtn.textContent = 'Start Cooking';
            nextBtn.textContent = 'Next Step';
            nextBtn.style.display = 'none';
            nextBtn.disabled = false;
            clearInterval(timerInterval);
            progressBar.style.width = '0%';
        };

        // Initial setup on page load
        document.addEventListener('DOMContentLoaded', () => {
            // Populate the dropdown menu
            for (const name in recipes) {
                const option = document.createElement('option');
                option.value = name;
                option.textContent = name;
                recipeSelect.appendChild(option);
            }
            // Load the first recipe by default
            const firstRecipe = Object.keys(recipes)[0];
            loadRecipe(firstRecipe);
        });

        // Event listener for recipe selection
        recipeSelect.addEventListener('change', (event) => {
            loadRecipe(event.target.value);
        });

        // Toggle visibility of Ingredients and Instructions
        document.getElementById('ingredients-section').querySelector('.section-title').addEventListener('click', () => {
            document.getElementById('ingredient-list').classList.toggle('hidden');
        });

        document.getElementById('instructions-section').querySelector('.section-title').addEventListener('click', () => {
            document.getElementById('instruction-list').classList.toggle('hidden');
        });
        
        // "Start Cooking" button logic
        startBtn.addEventListener('click', () => {
            const instructionItems = document.querySelectorAll('#instruction-list li');
            const selectedRecipe = recipes[recipeSelect.value];
            const prepTime = selectedRecipe.prepTime;

            if (currentStepIndex === 0) {
                instructionItems[currentStepIndex].classList.add('active-step');
                startBtn.textContent = 'Reset';
                nextBtn.style.display = 'block';
                
                let totalTime = prepTime * 60;
                let remainingTime = totalTime;
                
                timerInterval = setInterval(() => {
                    remainingTime--;
                    const minutes = Math.floor(remainingTime / 60);
                    const seconds = remainingTime % 60;
                    timerDisplay.textContent = `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
                    const progressPercentage = ((totalTime - remainingTime) / totalTime) * 100;
                    progressBar.style.width = `${progressPercentage}%`;

                    if (remainingTime <= 0) {
                        clearInterval(timerInterval);
                        timerDisplay.textContent = "Time's up!";
                    }
                }, 1000);
            } else {
                resetRecipeState();
                loadRecipe(recipeSelect.value); // Reload the recipe to reset everything
            }
        });

        // "Next Step" button logic
        nextBtn.addEventListener('click', () => {
            const instructionItems = document.querySelectorAll('#instruction-list li');
            
            instructionItems[currentStepIndex].classList.remove('active-step');
            currentStepIndex++;
            
            if (currentStepIndex < instructionItems.length) {
                instructionItems[currentStepIndex].classList.add('active-step');
            } else {
                nextBtn.textContent = 'Finished!';
                nextBtn.disabled = true;
                clearInterval(timerInterval);
                alert('Congratulations, you finished the recipe!');
            }
        });
    </script>
</body>
</html>
